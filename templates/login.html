<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Ashen World – Sign In</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}" />
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body class="game-theme">
  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3" style="background: var(--aw-bg-body-gradient);">
    <div class="game-card" style="max-width: 380px; width: 100%;">
      <div class="card-body p-4">
        <!-- Header -->
        <div class="text-center mb-4">
          <h1 class="h4 mb-1" style="color: var(--aw-text);">Ashen World</h1>
          <p style="color: var(--aw-text-muted); font-size: 13px;">Sign in to continue</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else 'info' }} alert-sm mb-3" style="font-size: 13px;">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Enter your username" />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password" />
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
        </form>

        <div class="text-center" style="color: var(--aw-text-muted); font-size: 13px;">
          New here? <a href="{{ url_for('auth.register') }}" style="color: var(--aw-accent);">Create an account</a>
        </div>

        <hr style="border-color: var(--aw-border);" />

        <div class="text-center">
          <a href="{{ url_for('main.landing') }}" style="color: var(--aw-text-dim); font-size: 13px;">← Back to Kingdom</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

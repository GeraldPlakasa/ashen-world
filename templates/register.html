<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Ashen World – Register</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}" />
</head>
<body class="game-theme">
  
  <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 2rem;">
    <div class="game-card" style="max-width: 420px; width: 100%;">
      <div class="card-body p-4">
        <!-- Logo -->
        <div class="text-center mb-4">
          <div style="font-size: 3rem;">✨</div>
          <h1 style="color: var(--aw-text); font-size: 1.5rem; font-weight: 700;">Join Ashen World</h1>
          <p style="color: var(--aw-text-muted); font-size: 0.875rem;">Create your account to spawn a hero</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} mb-3" style="font-size: 0.875rem;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Register Form -->
        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label for="username" style="color: var(--aw-text-muted); font-size: 0.8rem;" class="form-label">
              Username
            </label>
            <input type="text" id="username" name="username" class="form-control"
                   placeholder="Choose a username" required autocomplete="username"
                   style="background: var(--aw-bg-dark); border-color: var(--aw-border); color: var(--aw-text);" />
          </div>

          <div class="mb-3">
            <label for="password" style="color: var(--aw-text-muted); font-size: 0.8rem;" class="form-label">
              Password
            </label>
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Create a password" required autocomplete="new-password"
                   style="background: var(--aw-bg-dark); border-color: var(--aw-border); color: var(--aw-text);" />
          </div>

          <div class="mb-4">
            <label for="confirm_password" style="color: var(--aw-text-muted); font-size: 0.8rem;" class="form-label">
              Confirm Password
            </label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                   placeholder="Confirm your password" required autocomplete="new-password"
                   style="background: var(--aw-bg-dark); border-color: var(--aw-border); color: var(--aw-text);" />
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">
            ✨ Create Account
          </button>
        </form>

        <hr style="border-color: var(--aw-border);" />

        <div class="text-center">
          <p style="color: var(--aw-text-muted); font-size: 0.8rem;" class="mb-2">
            Already have an account?
          </p>
          <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm">
            ⏎ Login
          </a>
        </div>

        <div class="text-center mt-3">
          <a href="{{ url_for('landing') }}" style="color: var(--aw-text-dim); font-size: 0.8rem; text-decoration: none;">
            ← Back to Kingdom
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
